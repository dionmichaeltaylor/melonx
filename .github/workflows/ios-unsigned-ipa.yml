name: MeloNX 2.7 M2 diagnostic IPA
run-name: MeloNX 2.7 M2 diagnostic IPA (${{ github.ref_name }})

on:
  push:
    branches:
      - m2-performance-2.7
    paths:
      - ".github/workflows/ios-unsigned-ipa.yml"
      - "scripts/patch_melonx_2_7_diagnostics.py"

permissions:
  contents: read

concurrency:
  group: melonx-2-7-m2-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  SOURCE_REPOSITORY: flyingsquirrel0419/MeloNX-iOS
  SOURCE_COMMIT: 55bfd69b05427c6fc678bbb55c89343c25cf5db4
  XCODE_PROJECT: source/src/MeloNX/MeloNX.xcodeproj
  XCODE_SCHEME: MeloNX
  XCODE_CONFIGURATION: Release
  DERIVED_DATA_PATH: build/DerivedData
  IPA_OUTPUT_DIR: build/ipa
  RESULT_BUNDLE_PATH: build/MeloNX.xcresult

jobs:
  build:
    name: Build MeloNX 2.7 unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout MeloNX 2.7 source
        uses: actions/checkout@v4
        with:
          repository: flyingsquirrel0419/MeloNX-iOS
          ref: 55bfd69b05427c6fc678bbb55c89343c25cf5db4
          path: source
          lfs: true

      - name: Verify source and patch diagnostics
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$SOURCE_COMMIT"
          python3 scripts/patch_melonx_2_7_diagnostics.py
          grep -q 'MARKETING_VERSION = 2.7;' "$XCODE_PROJECT/project.pbxproj"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.stossy11.MeloNX;' "$XCODE_PROJECT/project.pbxproj"
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.stossy11.MeloNX.RamDonor;' "$XCODE_PROJECT/project.pbxproj"
          echo "Pinned source: $actual"
          echo "Version: MeloNX 2.7"
          echo "Bundle IDs restored to com.stossy11.MeloNX and its RamDonor extension."

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iOS 27'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Install .NET iOS workload
        timeout-minutes: 20
        run: dotnet workload install ios

      - name: Select LibHac feed
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*Include="Ryujinx.LibHac" Version="\([^"]*\)".*/\1/p' source/Directory.Packages.props)"
          for feed in \
            "https://starforgejo.dev/api/packages/Ryulynx/nuget" \
            "https://git.ryujinx.app/api/packages/projects/nuget" \
            "https://git.ryujinx.app/api/packages/ryubing/nuget"
          do
            if curl -fsSL -m 30 "$feed/registration/ryujinx.libhac/index.json" | grep -q "\"$version\""; then
              echo "Using $feed for Ryujinx.LibHac $version"
              sed -i '' "s#<add key=\"LibHacAlpha\" value=\"[^\"]*\"#<add key=\"LibHacAlpha\" value=\"$feed/index.json\"#" source/nuget.config
              exit 0
            fi
          done
          echo "Building pinned Ryujinx.LibHac from source"
          git clone -q https://starforgejo.dev/archive/LibHac_Ryubing.git "$RUNNER_TEMP/libhac"
          git -C "$RUNNER_TEMP/libhac" checkout -q "$LIBHAC_COMMIT"
          (cd "$RUNNER_TEMP/libhac" && ./build.sh Codegen)
          test -f "$RUNNER_TEMP/libhac/src/LibHac/Common/ResultNameResolver.Generated.cs"
          dotnet pack "$RUNNER_TEMP/libhac/src/LibHac/LibHac.csproj" -c Release -p:Version="$version" -o "$RUNNER_TEMP/libhac-feed"
          sed -i '' "s#<add key=\"LibHacAlpha\" value=\"[^\"]*\"#<add key=\"LibHacAlpha\" value=\"$RUNNER_TEMP/libhac-feed\"#" source/nuget.config
        env:
          LIBHAC_COMMIT: 23e402ebb6dedc517e34a98a033078dc0f6fd478

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-2.7-${{ hashFiles('source/Directory.Packages.props', 'source/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-2.7-

      - name: Run touch regression tests
        run: dotnet run --project source/tests/MeloNX.Touch.Tests -c Release

      - name: Publish Ryujinx.Library for iOS
        timeout-minutes: 65
        run: |
          set -euo pipefail
          dotnet publish -c Release -r ios-arm64 -p:ExtraDefineConstants=DISABLE_UPDATER source/src/Ryujinx.Library --self-contained true
          test -f source/src/Ryujinx.Library/bin/Release/net10.0/ios-arm64/native/Ryujinx.Library.dylib

      - name: Resolve Swift packages
        run: xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -resolvePackageDependencies

      - name: Build unsigned app
        timeout-minutes: 65
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);/\1/p' "$XCODE_PROJECT/project.pbxproj" | head -n 1)"
          test "$base_version" = "2.7"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$base_version.$GITHUB_RUN_NUMBER" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Collect Xcode diagnostics
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          if [ -d "$RESULT_BUNDLE_PATH" ]; then
            xcrun xcresulttool get --path "$RESULT_BUNDLE_PATH" --format json --legacy > build/diagnostics/xcresult.json || true
          fi
          if [ -d "$DERIVED_DATA_PATH/Logs" ]; then
            ditto "$DERIVED_DATA_PATH/Logs" build/diagnostics/Logs
          fi

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-2.7-build-diagnostics
          path: |
            ${{ env.RESULT_BUNDLE_PATH }}
            build/diagnostics
          if-no-files-found: warn

      - name: Package ad-hoc signed IPA
        run: |
          set -euo pipefail
          app_path="$DERIVED_DATA_PATH/Build/Products/${XCODE_CONFIGURATION}-iphoneos/MeloNX.app"
          test -d "$app_path"
          test -f "$app_path/Frameworks/Ryujinx.Library.dylib"
          mkdir -p "$IPA_OUTPUT_DIR/Payload"
          app="$IPA_OUTPUT_DIR/Payload/MeloNX.app"
          ditto "$app_path" "$app"

          find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            xargs -0 -n 1 codesign --force --sign - --timestamp=none
          for appex in "$app"/PlugIns/*.appex; do
            codesign --force --sign - --timestamp=none \
              --entitlements source/src/MeloNX/MeloNXRamDonor/MeloNXRamDonor.entitlements "$appex"
          done
          codesign --force --sign - --timestamp=none \
            --entitlements source/src/MeloNX/MeloNX/MeloNX.entitlements "$app"

          codesign --verify --deep --strict "$app"
          entitlements="$(codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -p -)"
          echo "$entitlements"
          grep -q 'com.apple.developer.kernel.increased-memory-limit' <<< "$entitlements"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" | grep -qx 'com.stossy11.MeloNX'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist" | grep -q '^2\.7\.'

          ditto source/src/MeloNX/MeloNX/MeloNX.entitlements "$IPA_OUTPUT_DIR/MeloNX-signing-entitlements.plist"
          (cd "$IPA_OUTPUT_DIR" && zip -qry MeloNX-2.7-diagnostic.ipa Payload)
          du -sh "$IPA_OUTPUT_DIR/MeloNX-2.7-diagnostic.ipa"

      - name: Upload MeloNX 2.7 diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-2.7-diagnostic-ipa
          path: |
            ${{ env.IPA_OUTPUT_DIR }}/MeloNX-2.7-diagnostic.ipa
            ${{ env.IPA_OUTPUT_DIR }}/MeloNX-signing-entitlements.plist
          if-no-files-found: error
